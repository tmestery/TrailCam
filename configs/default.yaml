# Default TrailCam experiment settings

seed: 42

dataset:
  hf_id: davanstrien/ena24-detection

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results

split:
  train: 0.70
  val: 0.15
  test: 0.15
  # Split at original-image level to avoid near-duplicate crops across splits
  level: image

classical:
  feature_cache: data/processed/classical_features.npz
  hsv_bins: [16, 8, 8]
  lbp_p: 8
  lbp_r: 1
  logistic_c: [0.1, 1.0, 10.0]
  svm_c: [0.1, 1.0, 10.0]
  svm_gamma: ["scale", 0.01]

cnn:
  architecture: resnet18
  pretrained: true
  image_size: 224
  batch_size: 32
  lr: 0.001
  epochs: 25
  patience: 5
  num_workers: 0

clip:
  model_name: ViT-B-32
  pretrained: openai
  batch_size: 64
